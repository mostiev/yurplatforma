name: pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/pages-build.py && rm -rf tests tools .github README.md
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan pages-new
          git add -A
          git commit -q -m "pages: $GITHUB_SHA"
          git push -f origin pages-new:pages
