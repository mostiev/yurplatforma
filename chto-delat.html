<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Что делать, если… — пошаговый план по вашей ситуации</title>
<meta name="description" content="Ответьте на два-три вопроса — получите план действий по закону РФ: какие документы составить, какие сроки соблюсти и что посчитать.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css?v=202610160018">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="index.html">юр<span>платформа</span></a>
    <nav><a href="proverka.html">Проверь себя</a> · <a href="index.html">Все документы</a></nav>
  </header>

  <section class="hero">
    <h1>Что делать, если…</h1>
    <p>Два-три вопроса — и план действий: что сделать, в каком порядке и какой документ составить.</p>
  </section>

  <main class="wz"><div class="wz-card" id="wz" aria-live="polite"></div></main>

  <footer class="site">План — общий ориентир по закону РФ, не юридическая консультация. Сроки и условия уточняются в каждом документе.</footer>
</div>
<script src="content/catalog.js?v=202610160018"></script>
<script src="content/wizard.js?v=202610160018"></script>
<script>
(function () {
  var W = window.WIZARD, root = document.getElementById("wz");
  var byId = {};
  CATALOG.items.forEach(function (i) { byId[i.id] = i; });
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  // путь ответов хранится в адресе: #3-1 — третий вариант, затем первый; так работают «Назад» браузера и ссылки
  function path() { return (location.hash.slice(1) || "").split("-").filter(function (x) { return /^\d+$/.test(x); }).map(Number); }
  function go(p) { location.hash = p.join("-"); }
  function walk(p) {
    var node = W.nodes[W.start], trail = [];
    for (var i = 0; i < p.length; i++) {
      var o = node && node.options[p[i]];
      if (!o) return { node: W.nodes[W.start], trail: [], p: [] };
      trail.push(o.label);
      if (o.plan) return { plan: o.plan, trail: trail, p: p.slice(0, i + 1) };
      node = W.nodes[o.next];
    }
    return { node: node, trail: trail, p: p };
  }
  function render() {
    var st = walk(path()), html = "";
    if (st.trail.length) html += '<ul class="wz-trail">' + st.trail.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>";
    if (st.plan) {
      html += '<h2 class="wz-q">' + esc(st.plan.title) + "</h2>";
      html += '<ol class="wz-plan">' + st.plan.steps.map(function (s) {
        var it = s.id && byId[s.id], link = "";
        if (it && it.live) link = '<a class="wz-link" href="d/' + it.id + '.html">' + esc(it.title) + ' <span class="tag">' + (it.kind === "calc" ? "посчитать" : "составить") + "</span></a>";
        return "<li><div><p>" + (s.when ? "<b>" + esc(s.when[0].toUpperCase() + s.when.slice(1)) + ".</b> " : "") + esc(s.text) + "</p>" + link + "</div></li>";
      }).join("") + "</ol>";
      if (st.plan.note) html += '<div class="wz-note">' + esc(st.plan.note) + "</div>";
    } else {
      html += '<h2 class="wz-q">' + esc(st.node.q) + '</h2><div class="wz-opts">' + st.node.options.map(function (o, i) {
        return '<button type="button" class="wz-opt" data-i="' + i + '"><span>' + esc(o.label) + "</span>" + (o.hint ? '<span class="h">' + esc(o.hint) + "</span>" : "") + "</button>";
      }).join("") + "</div>";
    }
    if (st.p.length) html += '<div class="wz-nav"><button type="button" class="btn ghost" data-back>Назад</button><button type="button" class="btn ghost" data-restart>Начать заново</button></div>';
    root.innerHTML = html;
  }
  root.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var p = walk(path()).p;
    if (b.hasAttribute("data-back")) go(p.slice(0, -1));
    else if (b.hasAttribute("data-restart")) go([]);
    else if (b.hasAttribute("data-i")) go(p.concat(Number(b.getAttribute("data-i"))));
  });
  window.addEventListener("hashchange", function () { render(); root.scrollIntoView({ block: "nearest" }); });
  render();
})();
</script>
</body>
</html>
